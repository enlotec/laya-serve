[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "laya-serve"
version = "0.1.0"
description = "Production REST and MCP wrapper for Convai Innovations Laya"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.14"
authors = [{ name = "enlotec" }]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "structlog>=24.0.0",
  "laya[serve,mcp]>=0.3.22,<0.4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0", "httpx>=0.27.0", "ruff>=0.8.0"]

[project.scripts]
enlotec-laya-serve = "laya_serve.main:cli"
enlotec-laya-serve-mcp = "laya_serve.modules.mcp.server:run_stdio"

[tool.hatch.build.targets.wheel]
packages = ["laya_serve"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.pytest.ini_options]
asyncio_mode = "auto"
