services:
  laya:
    image: "${LAYA_IMAGE:-ghcr.io/enlotec/laya-serve:latest}"
    ports:
      - "127.0.0.1:${LAYA_PORT:-8089}:8089"
    env_file:
      - path: .env
        required: false
    environment:
      LAYA_HOST: 0.0.0.0
      LAYA_PORT: "8089"
      LAYA_DEVICE: cpu
      LAYA_MODELS: "${LAYA_MODELS:-english,multilingual}"
      LAYA_PRELOAD: "${LAYA_PRELOAD:-true}"
      LAYA_THREADS: "${LAYA_THREADS:-4}"
    volumes:
      - laya_cache:/home/laya/.cache/huggingface
    restart: unless-stopped

volumes:
  laya_cache:
